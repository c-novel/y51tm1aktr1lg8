<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<title>Display</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  #screen { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #video { position: fixed; right: 12px; bottom: 12px; width: 200px; transform: scaleX(-1); opacity: 0; pointer-events: none; }
  #video.show { opacity: 0.9; }
  #debug { position: fixed; left: 12px; top: 12px; margin: 0; padding: 8px 10px; background: rgba(0,0,0,.7); color: #0f0; font: 13px/1.5 monospace; white-space: pre; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<video id="video" playsinline muted></video>
<pre id="debug" hidden></pre>
<script type="module" src="src/main.js"></script>
</body>
</html>
